---
- name: Collect selected facts
  hosts: all
  gather_facts: false

  tasks:
  - name: Collect nw and hw facts
    ansible.builtin.setup:
      gather_subset:
        - '!all'
        - '!min'
        - network
        - hardware

#- name: Configure production web servers
#  hosts: db
#  gather_facts: true
#  roles:
#    - role: common

- name: Configure Swapfile
  hosts: db
  gather_facts: true
  vars_prompt:
    - name: mode_output
      prompt: 'Введите режим удаления (1 - авто, 2 - переменная):'
      private: false
      default: '2'
  roles:
    - swaptrasher
